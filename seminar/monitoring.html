<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitoring Sidang PRODISTIK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/seminar/assets/css/style.css">
</head>
<body>
  <a class="skip" href="#main">Lewati ke konten utama</a>
  <header class="top">
    <div class="top-in">
      <div><p class="app">Monitoring Sidang PRODISTIK</p><p class="org">MAN 2 Kota Probolinggo</p></div>
      <a class="lnk" href="/seminar/index.html">Halaman penguji</a>
    </div>
  </header>

  <main id="main" class="page">
    <!-- Pola List / Index -->
    <div class="head">
      <div>
        <h1>Progres sidang</h1>
        <p id="ringkas" class="muted" aria-live="polite">Memuat ringkasan…</p>
      </div>
      <button id="btnRefresh" class="btn secondary" type="button">Muat ulang</button>
    </div>

    <div class="toolbar">
      <div class="field"><label for="fCari">Cari nama siswa</label><input id="fCari" type="search" autocomplete="off"></div>
      <details class="filters" id="filters">
        <summary class="btn secondary"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 6h18"/><path d="M7 12h10"/><path d="M10 18h4"/></svg> Filter</summary>
      </details>
    </div>
    <div class="fpanel" id="fpanel" hidden>
      <div class="field"><label for="fTgl">Tanggal</label><input id="fTgl" type="date"></div>
      <div class="field">
        <label for="fJenis">Jenis sidang</label>
        <select id="fJenis">
          <option value="SEMUA">Semua</option>
          <option value="PROPOSAL">Seminar Proposal</option>
          <option value="SIDANG_AKHIR">Sidang Akhir</option>
        </select>
      </div>
      <div class="field">
        <label for="fKelas">Kelas asal</label>
        <select id="fKelas"><option value="SEMUA">Semua kelas</option></select>
      </div>
      <div class="field">
        <label for="fStatus">Status</label>
        <select id="fStatus">
          <option value="SEMUA">Semua</option>
          <option value="BELUM DIMULAI">Belum dimulai</option>
          <option value="PROSES PENILAIAN">Proses penilaian</option>
          <option value="BELUM UPLOAD BERKAS">Belum upload berkas</option>
          <option value="SELESAI">Selesai</option>
          <option value="BELUM ADA PENGUJI">Belum ada penguji</option>
        </select>
      </div>
      <button id="btnReset" class="btn secondary" type="button">Atur ulang filter</button>
    </div>
    <div class="chips" id="chips" aria-label="Filter aktif"></div>

    <div class="frame" id="frame" aria-live="polite"></div>
    <p class="muted" id="updated" style="margin-top:8px"></p>
  </main>

  <!-- Panel samping: unggah berkas oleh siswa -->
  <dialog id="dlg" aria-labelledby="dlgTitle">
    <form id="formUpload" method="dialog" novalidate>
      <div class="dlg-body">
        <h2 id="dlgTitle">Unggah berkas</h2>
        <p class="muted" id="dlgSub" style="margin:4px 0 24px"></p>
        <div class="field">
          <label for="uNomor">NISN <span class="req" aria-hidden="true">*</span></label>
          <input id="uNomor" type="text" inputmode="numeric" autocomplete="off" aria-required="true" aria-describedby="hNomor errNomor">
          <p class="hint" id="hNomor">Dipakai untuk memastikan berkas ini milik Anda.</p>
          <div class="err" id="errNomor" role="alert"></div>
        </div>
        <div class="field">
          <label for="uPpt">File PPT <span class="muted">(.ppt, .pptx, .pdf)</span></label>
          <input id="uPpt" type="file" accept=".ppt,.pptx,.pdf" aria-describedby="sPpt errPpt">
          <p class="hint" id="sPpt"></p>
          <div class="err" id="errPpt" role="alert"></div>
        </div>
        <div class="field">
          <label for="uLaporan">File laporan TA <span class="muted">(.pdf, .doc, .docx)</span></label>
          <input id="uLaporan" type="file" accept=".pdf,.doc,.docx" aria-describedby="sLaporan errLaporan">
          <p class="hint" id="sLaporan"></p>
          <div class="err" id="errLaporan" role="alert"></div>
        </div>
        <div id="dlgErr" class="err" role="alert"></div>
      </div>
      <div class="dlg-foot">
        <div class="actions">
          <button type="button" class="btn secondary" id="dlgTutup">Tutup</button>
          <button type="submit" class="btn" id="dlgKirim">Unggah berkas</button>
        </div>
      </div>
    </form>
  </dialog>

  <script src="/seminar/assets/js/config.js"></script>
  <script src="/seminar/assets/js/api.js"></script>
  <script src="/seminar/assets/js/monitoring.js"></script>
</body>
</html>
